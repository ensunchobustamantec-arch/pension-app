<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
    </style>
  </defs>

  <!-- Fondo circular verde oscuro -->
  <circle cx="100" cy="100" r="100" fill="#1B4332"/>

  <!-- Techo -->
  <polygon points="100,30 45,85 155,85" fill="#D4AF37"/>

  <!-- Chimney -->
  <rect x="118" y="38" width="10" height="22" rx="2" fill="#B8860B"/>

  <!-- Cuerpo casa -->
  <rect x="52" y="83" width="96" height="70" rx="3" fill="#D4AF37"/>

  <!-- Letra E (verde dentro de la casa) -->
  <rect x="68" y="95" width="42" height="7" rx="1.5" fill="#1B4332"/>
  <rect x="68" y="109" width="32" height="7" rx="1.5" fill="#1B4332"/>
  <rect x="68" y="123" width="42" height="7" rx="1.5" fill="#1B4332"/>
  <rect x="68" y="95" width="7" height="35" rx="1.5" fill="#1B4332"/>

  <!-- Puerta -->
  <rect x="112" y="118" width="22" height="35" rx="2" fill="#B8860B"/>

  <!-- Ventana -->
  <rect x="118" y="95" width="18" height="16" rx="2" fill="#2D6A4F"/>
  <line x1="127" y1="95" x2="127" y2="111" stroke="#D4AF37" stroke-width="1"/>
  <line x1="118" y1="103" x2="136" y2="103" stroke="#D4AF37" stroke-width="1"/>

  <!-- Texto Pensión Ensuncho -->
  <text x="100" y="172" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="13" fill="#F5F0E8" text-anchor="middle">Pensión</text>
  <text x="100" y="188" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="13" fill="#F5F0E8" text-anchor="middle">Ensuncho</text>
</svg>
